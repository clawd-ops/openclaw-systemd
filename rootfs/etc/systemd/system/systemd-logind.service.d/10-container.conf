# The RuntimeDefault seccomp profile blocks the mount-namespace setup these
# sandboxing options need (logind fails with 226/NAMESPACE). Seccomp stays on;
# logind runs without these extra namespaces instead.
[Service]
PrivateTmp=no
ProtectSystem=no
ProtectHome=no
ProtectControlGroups=no
ProtectKernelModules=no
ProtectKernelLogs=no
ReadWritePaths=
