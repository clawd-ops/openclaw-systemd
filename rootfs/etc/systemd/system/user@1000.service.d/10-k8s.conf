# System drop-in on the uid 1000 user MANAGER. OpenClaw rejects any drop-in on
# its own gateway unit, so the Kubernetes env and the stop budget live here.
[Service]
# User units, including the gateway, inherit the manager's environment.
EnvironmentFile=/run/openclaw/gateway.env
# Must exceed the gateway unit's TimeoutStopSec (330s, fixed by OpenClaw,
# which plans up to 315s of in-flight-work drain from it). A shorter value
# here would SIGKILL a gateway mid-drain. An idle gateway stops in well under
# a second, so only a pod with work in flight ever waits this long. The pod's
# terminationGracePeriodSeconds must be larger still.
TimeoutStopSec=340
