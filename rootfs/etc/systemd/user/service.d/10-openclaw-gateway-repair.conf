# Run OpenClaw's Doctor repair before the gateway starts, but only when it is
# needed: after an image upgrade, after a start that never became healthy, or
# on request. The upstream image runs `doctor --fix` on every start from its
# entrypoint; this image replaces that entrypoint, so without this nothing
# migrates state or converges plugins after an upgrade. See README.md.
#
# Why the top-level service.d (applies to every user service) instead of
# openclaw-gateway.service.d: OpenClaw refuses to install or mutate its unit
# when any unit-specific drop-in is owned by another account
# (SERVICE_DEFINITION_SEALED [foreign-owner]); only files in a top-level
# service.d directory are exempt as shared admin drop-ins. Shipped in the
# image, so rolling back to an image without it removes it too.
#
# The scripts get the unit name (%n) and do nothing for any unit other than
# openclaw-gateway.service.
[Service]
ExecStartPre=/usr/local/libexec/openclaw-systemd/repair-if-needed %n
# Detached, so the start job does not wait on it. Clears the start-pending
# marker once the gateway answers /healthz.
ExecStartPost=-/bin/sh -c '/usr/local/libexec/openclaw-systemd/mark-healthy %n &'
# The generated gateway unit allows 30s, which a Doctor run on a real state
# volume overruns (about 100s with nothing to repair). This also applies to the
# user manager's other services (the user D-Bus daemon, transient units); a
# longer start ceiling does not change how they behave when they start
# normally. Keep the Kubernetes startup probe's window longer than this.
TimeoutStartSec=15min
