# Overrides Debian's /usr/lib/tmpfiles.d/tmp.conf ("D /tmp"), which empties
# /tmp at every boot. In a pod, /tmp is typically an emptyDir shared with
# other containers, and systemd must not wipe their files when this
# container restarts. Kubernetes already gives it a fresh lifetime per pod.
d /tmp 1777 root root -
d /var/tmp 1777 root root -
